name: CI
'on':
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v6
        name: Check depps

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
        name: Setup node

      - run: pnpm install --frozen-lockfile
        name: Install dependencies

      - run: pnpm run format
        name: Format code

      - run: pnpm run lint
        name: Lint code
