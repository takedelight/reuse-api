name: CI
'on':
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        name: Check depps

      - run: git clean -xfd
        name: Clean workspace

      - uses: pnpm/action-setup@v4
        with:
          version: 9
        name: Setup pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
        name: Setup node

      - run: pnpm install --no-frozen-lockfile
        name: Install dependencies

      - run: pnpm prisma generate
        name: Generate prisma client

      - run: pnpm run format
        name: Format code

      - run: pnpm run lint
        name: Lint code

      - run: pnpm run test
        name: Run tests